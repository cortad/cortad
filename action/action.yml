name: Cortad
description: Runs a simulation against your AI app and reports which questions it answered the wrong way.
author: Cortad

inputs:
  plays:
    description: 'smoke, all, or full. Default all: the set a pull request should hold.'
    required: false
    default: all
  changed:
    description: Comma-separated files to scope the run to. Leave empty to run the whole set.
    required: false
    default: ''
  judge:
    description: A model of your own to answer the questions. Leave empty to use Cortad.
    required: false
    default: ''
  schema:
    description: Where cortad.json is.
    required: false
    default: cortad.json
  sarif:
    description: Where to write SARIF. Upload it and each failure lands on a line in the diff.
    required: false
    default: cortad.sarif
  junit:
    description: Where to write JUnit XML.
    required: false
    default: cortad.junit.xml
  version:
    description: Which version of the command to run.
    required: false
    default: latest

outputs:
  sarif:
    description: The SARIF file that was written.
    value: ${{ inputs.sarif }}
  junit:
    description: The JUnit file that was written.
    value: ${{ inputs.junit }}

runs:
  using: composite
  steps:
    # The app has to be up already. Starting it here would hide the one failure that matters most:
    # an app that never answered, which is not a pass.
    # Every input arrives as an environment variable and is read as "$NAME". Written as ${{ }} inside
    # the script, GitHub substitutes the value into the text before bash parses it, so a caller
    # wiring a pull request title or a branch name into one of these would be handing the runner
    # whatever it contained.
    - shell: bash
      env:
        CORTAD_JUDGE_KEY: ${{ env.CORTAD_JUDGE_KEY }}
        CORTAD_JUDGE_URL: ${{ env.CORTAD_JUDGE_URL }}
        PLAYS: ${{ inputs.plays }}
        CHANGED: ${{ inputs.changed }}
        JUDGE: ${{ inputs.judge }}
        SCHEMA: ${{ inputs.schema }}
        SARIF: ${{ inputs.sarif }}
        JUNIT: ${{ inputs.junit }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$VERSION" in
          latest|[0-9]*) ;;
          *) echo "version must be latest or a version number, not: $VERSION" >&2; exit 1 ;;
        esac
        args=(--schema "$SCHEMA" --sarif "$SARIF" --junit "$JUNIT")
        case "$PLAYS" in
          smoke) ;;
          full) args+=(--full) ;;
          *) args+=(--all) ;;
        esac
        if [ -n "$CHANGED" ]; then args+=(--changed "$CHANGED"); fi
        if [ -n "$JUDGE" ]; then args+=(--judge "$JUDGE"); fi
        npx --yes "cortad@$VERSION" "${args[@]}"
