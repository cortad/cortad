# Publishes cortad from this repository with npm provenance: the release on npm links to the exact
# commit and run that built it. Triggered by a version tag; npm accepts it through trusted
# publishing (OIDC), so no npm token exists anywhere.
#
# npm answers "your package is being processed" and exits 0 long before the version exists: 0.4.7 and
# 0.5.0 each took about forty minutes to appear. A tag whose version is not on the registry yet is a
# publish still in flight, not a failed one, and a private repository does not stop the attestation.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # 2026-10-27: this does not publish yet and the reason is not in this file. npm's trusted
      # publisher for the package names this repository and this workflow and reads Valid, the job
      # can mint an id token, npm is new enough, and npm still never asks for one: it stops at
      # ENEEDAUTH. Either NPM_TOKEN reaches this job, or someone publishes 1.0.0 by hand once.
      - run: npm install -g npm@latest
      - run: npm --version
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # A prerelease (0.3.0-rc.1) goes out under the next tag, so a stack can walk it before a
      # customer's `npx cortad` resolves to it.
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if node -p "require('./package.json').version" | grep -q -- -; then npm publish --access public --tag next; else npm publish --access public; fi
