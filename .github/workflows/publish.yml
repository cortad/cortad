# Publishes cortad from this repository through npm trusted publishing (OIDC): triggered
# by a version tag, with no npm token anywhere. npm makes no provenance for a private repository.
#
# npm answers "your package is being processed" and exits 0 long before the version exists: 0.4.7 and
# 0.5.0 each took about forty minutes to appear. A tag whose version is not on the registry yet is a
# publish still in flight, not a failed one, and a private repository does not stop the attestation.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or later; the Node image's own npm may be older.
      - run: npm install -g npm@11.15.0
      # A prerelease (0.6.1-rc.1) goes out under the next tag, so a stack can walk it before a
      # customer's install resolves to it; a release becomes latest.
      - run: |
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) npm publish --access public --tag next ;; *) npm publish --access public ;; esac
