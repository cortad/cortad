# Publishes cortad from this repository. Triggered by a version tag; npm accepts it through trusted
# publishing (OIDC), so no npm token exists anywhere.
#
# No provenance. An attestation names a public source commit, and this repository is private: npm
# took the tarball, said it was being processed, printed the version and exited 0, and the version
# never appeared. 0.4.6 was the last one to land, hours before the repository was closed, and 0.4.7
# and 0.5.0 both went out green into nothing. Provenance comes back the day the repository is public.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: The tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # A prerelease (0.3.0-rc.1) goes out under the next tag, so a stack can walk it before a
      # customer's `npx cortad` resolves to it.
      - run: |
          if node -p "require('./package.json').version" | grep -q -- -; then npm publish --access public --provenance=false --tag next; else npm publish --access public --provenance=false; fi
